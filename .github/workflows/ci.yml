name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI nunca opera. Fail-closed explícito.
  TRADING_MODE: demo
  REAL_TRADING_UNLOCKED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forex
          POSTGRES_PASSWORD: forex
          POSTGRES_DB: forex_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forex -d forex_bot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://forex:forex@localhost:5432/forex_bot
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        # MetaTrader5 é win32-only; o marker no pyproject já o exclui aqui.
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy backend

      - name: Testes + coverage
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

# O job `frontend` (tsc --noEmit + eslint + vitest) entra na história 17,
# junto com o diretório frontend/. Ponytail: nada de job que não tem o que rodar.
