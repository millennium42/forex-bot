[project]
name = "forex-bot"
version = "0.1.0"
description = "Forex trading bot: sentimento + análise técnica, execução via MetaTrader 5"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "pandas>=2.2",
    "ta>=0.11",
    "httpx>=0.28",
    "feedparser>=6.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sentry-sdk>=2.18",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Pesado (~2GB com torch). Instale só onde o FinBERT roda de fato.
nlp = [
    "transformers>=4.46",
    "torch>=2.5",
    "textblob>=0.18",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: exige Postgres e Redis rodando (docker compose up -d)",
    "mt5: exige terminal MetaTrader 5 conectado",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert é esperado em testes

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["MetaTrader5.*", "ta.*", "feedparser.*", "textblob.*"]
ignore_missing_imports = true
